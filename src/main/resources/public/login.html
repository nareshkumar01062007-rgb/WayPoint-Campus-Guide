<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in - Waypoint</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Roboto:400,500,700">
    <link rel="stylesheet" href="/style.css">
</head>

<body>

    <header class="app-bar">
        <span class="title"><a href="/">Waypoint</a></span>
        <span class="subtitle">Rajalakshmi Engineering College</span>
    </header>

    <main class="narrow">
        <div class="card form-card">
            <h1 class="form-title" id="form-title">Sign in</h1>

            <form id="auth-form" novalidate>
                <div class="field" id="name-field" style="display:none">
                    <label for="name">Name</label>
                    <input type="text" id="name" autocomplete="name">
                </div>
                <div class="field">
                    <label for="email">Email</label>
                    <input type="email" id="email" autocomplete="email">
                </div>
                <div class="field">
                    <label for="password">Password</label>
                    <input type="password" id="password" autocomplete="current-password">
                    <div class="form-hint" id="password-hint" style="display:none">At least 8 characters</div>
                </div>

                <div class="form-error" id="error"></div>

                <div class="form-actions">
                    <button type="button" class="btn-flat on-surface" id="toggle-btn">Create account</button>
                    <button type="submit" class="btn-raised" id="submit-btn">Sign in</button>
                </div>
            </form>
        </div>
    </main>

    <script>
        const form = document.getElementById('auth-form');
        const titleEl = document.getElementById('form-title');
        const nameField = document.getElementById('name-field');
        const passwordHint = document.getElementById('password-hint');
        const passwordInput = document.getElementById('password');
        const errorEl = document.getElementById('error');
        const toggleBtn = document.getElementById('toggle-btn');
        const submitBtn = document.getElementById('submit-btn');

        let mode = 'login';   // 'login' or 'register'

        function setMode(newMode) {
            mode = newMode;
            const registering = mode === 'register';
            titleEl.textContent = registering ? 'Create account' : 'Sign in';
            submitBtn.textContent = registering ? 'Create account' : 'Sign in';
            toggleBtn.textContent = registering ? 'I have an account' : 'Create account';
            nameField.style.display = registering ? 'block' : 'none';
            passwordHint.style.display = registering ? 'block' : 'none';
            passwordInput.autocomplete = registering ? 'new-password' : 'current-password';
            errorEl.textContent = '';
        }

        toggleBtn.addEventListener('click', () => {
            setMode(mode === 'login' ? 'register' : 'login');
        });

        form.addEventListener('submit', async (event) => {
            event.preventDefault();
            errorEl.textContent = '';

            const payload = {
                email: document.getElementById('email').value,
                password: passwordInput.value
            };
            if (mode === 'register') {
                payload.name = document.getElementById('name').value;
            }

            const url = mode === 'register' ? '/api/auth/register' : '/api/auth/login';

            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await response.json();

                if (response.ok) {
                    window.location.href = '/';
                } else {
                    errorEl.textContent = data.error || 'Something went wrong';
                }
            } catch (err) {
                errorEl.textContent = 'Could not reach the server';
            }
        });
    </script>
</body>

</html>
